<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Aluminum EV Forecast{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" async></script>
  <script src="{{ url_for('static', filename='js/charts.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/forecast_controls.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Aluminum EV Forecast</a>
    <nav class="nav">
      <a href="{{ url_for('index') }}">대시보드</a>
      <a href="{{ url_for('dashboard_api') }}">API</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>알루미늄 가격과 전기자동차 판매량 상관 분석 및 예측</span>
  </footer>
</body>
</html>
